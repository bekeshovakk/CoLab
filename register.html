<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoLab - Register</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <section class="id"><span class="logo"> CoLab</span></section>
            <nav aria-label="Основная навигация">
                <ul>
                    <li><a href="profile.html"> PROFILE </a></li>
                    <li><a href="issues.html"> PROBLEMS & SOLUTIONS </a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="hero container">
        <div class="hero--info">
            <h2>get started</h2>
            <h1>Create your profile</h1>
            
            <form id="regForm" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px; max-width: 400px;">
                <input type="text" id="nameInput" placeholder="Your Name or Nickname" required style="padding: 12px 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
                
                <input type="password" id="passwordInput" placeholder="Password" required style="padding: 12px 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">

                <select id="statusSelect" required style="padding: 12px 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; background-color: #fff;">
                    <option value="" disabled selected>Select your role...</option>
                    <option value="Student">Student</option>
                    <option value="Researcher / Scientist">Researcher / Scientist</option>
                    <option value="Company / Organization">Company</option>
                </select>

                <button type="submit" class="btn" style="padding: 12px 20px; background: #1c1d1d; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px;">
                    Register
                </button>
            </form>
        </div> 
    </div> 

    <script>
  const regForm = document.getElementById('regForm');

  regForm.addEventListener('submit', function(e) {
    e.preventDefault();

    const nameValue = document.getElementById('nameInput').value.trim();
    const passwordValue = document.getElementById('passwordInput').value;
    const statusValue = document.getElementById('statusSelect').value;

    // Достаем список ВСЕХ зарегистрированных пользователей на этом устройстве
    let usersList = JSON.parse(localStorage.getItem('colab_registered_users')) || [];

    // Ищем, есть ли уже пользователь с таким именем
    const existingUser = usersList.find(u => u.name.toLowerCase() === nameValue.toLowerCase());

    if (existingUser) {
      // Если юзер существует — проверяем пароль для входа
      if (existingUser.password !== passwordValue) {
        alert("Неверный пароль для этого аккаунта!");
        return;
      }
    } else {
      // Если юзер новый — добавляем его в список
      usersList.push({
        name: nameValue,
        password: passwordValue,
        status: statusValue
      });
      localStorage.setItem('colab_registered_users', JSON.stringify(usersList));
    }

    // Сохраняем текущего активного пользователя
    localStorage.setItem('colab_user_name', nameValue);
    localStorage.setItem('colab_user_password', passwordValue);
    localStorage.setItem('colab_user_status', statusValue);
    localStorage.setItem('colab_is_logged_in', 'true');

    // Переходим в профиль
    window.location.href = 'profile.html';
  });
</script>
</body>
</html>
