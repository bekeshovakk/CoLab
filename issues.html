<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoLab - Problems & Solutions</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .issue-card {
            background: #ffffff;
            border: 1px solid #e2e1d7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .issue-author {
            font-weight: 700;
            font-size: 15px;
            color: #18181b;
        }
        .issue-role {
            font-size: 12px;
            color: #6b7280;
            background: #f4f4f5;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }
        .issue-text {
            margin: 12px 0;
            font-size: 15px;
            color: #27272a;
        }
        .reply-box {
            margin-left: 24px;
            border-left: 2px solid #e2e1d7;
            padding-left: 16px;
            margin-top: 12px;
        }
        .reply-item {
            background: #fafafa;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            position: relative;
        }
        .reply-btn {
            background: none;
            border: none;
            color: #2d5a27;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            padding: 0;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .reply-form {
            display: none;
            margin-top: 10px;
            gap: 8px;
        }
        .reply-form.active {
            display: flex;
        }
        .admin-panel {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <section class="id"><span class="logo"> CoLab</span></section>
            <nav aria-label="Основная навигация">
                <ul>
                    <li><a href="profile.html"> PROFILE </a></li>
                    <li><a href="issues.html"> PROBLEMS & SOLUTIONS </a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="hero container">
        <div class="hero--info" style="width: 100%; max-width: 700px;">
            <h2>Community Feed</h2>
            <h1>Problems & Solutions</h1>

            <!-- Панель Администратора прям на странице -->
            <div class="admin-panel">
                <span style="font-size: 14px; font-weight: 600; color: #991b1b;">🔑 Admin Access:</span>
                <input type="password" id="adminPassInput" placeholder="Enter password" style="padding: 6px 10px; border-radius: 6px; border: 1px solid #fca5a5; font-size: 14px;">
                <button onclick="checkAdminPassword()" style="padding: 6px 14px; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Activate</button>
                <span id="adminStatusText" style="font-size: 13px; color: #15803d; font-weight: 600;"></span>
            </div>

            <form id="postForm" style="display: flex; flex-direction: column; gap: 12px; margin: 24px 0;">
                <textarea id="issueText" placeholder="Describe a problem or share a research topic..." required style="padding: 14px; border-radius: 10px; border: 1px solid #ccc; font-size: 15px; min-height: 90px; font-family: inherit;"></textarea>
                <button type="submit" class="btn" style="align-self: flex-start; padding: 10px 20px; background: #1c1d1d; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
                    Post Problem
                </button>
            </form>

            <div id="issuesFeed"></div>
        </div> 
    </div> 

    <script>
        const isLoggedIn = localStorage.getItem('colab_is_logged_in');
if (isLoggedIn !== 'true') {
  window.location.href = 'register.html';
}
      const currentUser = localStorage.getItem('colab_user_name') || 'Anonymous Student';
      const currentRole = localStorage.getItem('colab_user_status') || 'Student';

      const badWords = ["мат1", "мат2", "fuck", "shit", "дурак", "дебил"]; 

      function filterBadWords(text) {
        let cleanedText = text;
        badWords.forEach(word => {
          const reg = new RegExp(word, 'gi');
          cleanedText = cleanedText.replace(reg, '***');
        });
        return cleanedText;
      }

      function canDelete(author) {
        const isAdmin = localStorage.getItem('colab_is_admin') === 'true';
        return currentUser === author || isAdmin;
      }

      // Проверка пароля прямо из поля ввода
      function checkAdminPassword() {
        const inputPass = document.getElementById('adminPassInput').value;
        const statusText = document.getElementById('adminStatusText');

        if (inputPass === "colab2026") {
          localStorage.setItem('colab_is_admin', 'true');
          statusText.textContent = "✓ Admin Mode Active!";
          document.getElementById('adminPassInput').value = '';
          renderIssues();
        } else {
          alert("Incorrect password!");
        }
      }

      let issuesData = JSON.parse(localStorage.getItem('colab_issues_list')) || [
        {
          id: 1,
          author: "Dr. Alex Reed",
          role: "Researcher / Scientist",
          text: "We need an accessible database for urban infrastructure objects.",
          replies: [
            { author: "Jordan Smith", role: "Student", text: "We are currently collecting data for this project!" }
          ]
        }
      ];

      function saveAndRender() {
        localStorage.setItem('colab_issues_list', JSON.stringify(issuesData));
        renderIssues();
      }

      function renderIssues() {
        const feed = document.getElementById('issuesFeed');
        feed.innerHTML = '';

        // Если админка уже включена, подписываем текст
        if (localStorage.getItem('colab_is_admin') === 'true') {
          document.getElementById('adminStatusText').textContent = "✓ Admin Mode Active!";
        }

        issuesData.forEach((issue, issueIndex) => {
          const card = document.createElement('div');
          card.className = 'issue-card';

          let repliesHtml = '';
          issue.replies.forEach((reply, replyIndex) => {
            const showReplyDelete = canDelete(reply.author);
            repliesHtml += `
              <div class="reply-item">
                <span class="issue-author">${reply.author}</span>
                <span class="issue-role">${reply.role}</span>
                ${showReplyDelete ? `<button class="delete-btn" onclick="deleteReply(${issueIndex}, ${replyIndex})">Delete</button>` : ''}
                <p class="issue-text" style="margin: 4px 0 0 0;">${reply.text}</p>
              </div>
            `;
          });

          const showPostDelete = canDelete(issue.author);

          card.innerHTML = `
            <div>
              <span class="issue-author">${issue.author}</span>
              <span class="issue-role">${issue.role}</span>
              ${showPostDelete ? `<button class="delete-btn" onclick="deleteIssue(${issueIndex})">Delete Post</button>` : ''}
            </div>
            <p class="issue-text">${issue.text}</p>
            <button class="reply-btn" onclick="toggleReplyForm(${issueIndex})">Reply</button>

            <div class="reply-form" id="replyForm-${issueIndex}">
              <input type="text" id="replyInput-${issueIndex}" placeholder="Write a reply..." style="flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc;">
              <button onclick="addReply(${issueIndex})" style="padding: 8px 14px; background: #2d5a27; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Send</button>
            </div>

            <div class="reply-box">${repliesHtml}</div>
          `;

          feed.appendChild(card);
        });
      }

      document.getElementById('postForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const textInput = document.getElementById('issueText');

        issuesData.unshift({
          id: Date.now(),
          author: currentUser,
          role: currentRole,
          text: filterBadWords(textInput.value),
          replies: []
        });

        textInput.value = '';
        saveAndRender();
      });

      function toggleReplyForm(index) {
        const form = document.getElementById(`replyForm-${index}`);
        form.classList.toggle('active');
      }

      function addReply(index) {
        const input = document.getElementById(`replyInput-${index}`);
        if (!input.value.trim()) return;

        issuesData[index].replies.push({
          author: currentUser,
          role: currentRole,
          text: filterBadWords(input.value)
        });

        saveAndRender();
      }

      function deleteIssue(index) {
        if (confirm("Are you sure you want to delete this post?")) {
          issuesData.splice(index, 1);
          saveAndRender();
        }
      }

      function deleteReply(issueIndex, replyIndex) {
        if (confirm("Delete this reply?")) {
          issuesData[issueIndex].replies.splice(replyIndex, 1);
          saveAndRender();
        }
      }

      renderIssues();
    </script>
</body>
</html>
