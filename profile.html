<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoLab</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <section class="id"><span class="logo"> CoLab</span></section>
            <nav aria-label="Основная навигация">
    <ul>
        <li><a href="profile.html"> PROFILE </a></li>
        <li><a href="issues.html"> PROBLEMS & SOLUTIONS </a></li>
        <!-- Кнопка выхода -->
        <li><a href="#" onclick="logoutUser(); return false;" style="color: #6b7280;"> LOG OUT </a></li>
    </ul>
</nav>
        </div>
    </header>

    <div class="hero container">
        <div class="hero--info">
            <h2>your profile</h2>
            <!-- Добавили id="userName" и id="userStatus" -->
            <h1 id="userName">Loading...</h1>
            <h3 id="userStatus">Student / Researcher</h3>
        </div> 
    </div> 

    <!-- Скрипт, который автоматически берет имя из памяти -->
    <script>
  const isLoggedIn = localStorage.getItem('colab_is_logged_in');
  const savedName = localStorage.getItem('colab_user_name');

  // Если пользователь НЕ вошел — отправляем регистрироваться
  if (isLoggedIn !== 'true' || !savedName) {
    window.location.href = 'register.html';
  } else {
    // Если вошел — подставляем имя и роль
    document.getElementById('userName').textContent = savedName;
    document.getElementById('userStatus').textContent = localStorage.getItem('colab_user_status') || 'Student';
  } 
        function logoutUser() {
  // Убираем флаг активного входа
  localStorage.removeItem('colab_is_logged_in');
  
  // При желании можно очистить и имя текущего пользователя:
  // localStorage.removeItem('colab_user_name');

  // Перенаправляем на страницу регистрации
  window.location.href = 'register.html';
}
</script>
</body>
</html>
