<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoLab</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <section class="id"><span class="logo"> CoLab</span></section>
            <nav aria-label="Основная навигация">
                <ul>
                    <li><a href="profile.html#prof"> PROFILE </a></li>
                    <li><a href="issues.html"> PROBLEMS & SOLUTIONS </a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="hero container">
        <div class="hero--info">
            <h2>your profile</h2>
            <!-- Добавили id="userName" и id="userStatus" -->
            <h1 id="userName">Loading...</h1>
            <h3 id="userStatus">Student / Researcher</h3>
        </div> 
    </div> 

    <!-- Скрипт, который автоматически берет имя из памяти -->
    <script>
      // Читаем имя из памяти браузера
      const savedName = localStorage.getItem('colab_user_name');
      const savedStatus = localStorage.getItem('colab_user_status');

      // Если имя есть в памяти, подставляем его в <h1>
      if (savedName) {
        document.getElementById('userName').textContent = savedName;
      } else {
        document.getElementById('userName').textContent = 'Guest';
      }

      if (savedStatus) {
        document.getElementById('userStatus').textContent = savedStatus;
      }
    </script>
</body>
</html>
